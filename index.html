            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Brandschutzkonzepte dürfen von qualifizierten Fachplanern erstellt werden, wie Brandschutzsachverständigen, Brandschutzingenieuren oder Architekten und Ingenieuren mit entsprechender Fachkunde im Brandschutz. In manchen Bundesländern gibt es spezielle Anforderungen an die Qualifikation."

          },

            "@type": "Question",
            "name": "Sind Flucht- und Rettungspläne Pflicht?",
            "acceptedAnswer": {
              "@type": "Answer",

            }
          },
          {
            "@type": "Question",
            "name": "Was ist Sabotageschutz für Infrastruktur im Außenbereich?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sabotageschutz der Infrastruktur umfasst den Schutz von Stromleitungen, Versorgungseinrichtungen und sicherheitskritischer Infrastruktur im Außenbereich vor vorsätzlicher Beschädigung. Arnold Brandschutz plant und realisiert geeignete Schutzmaßnahmen gemäß den aktuellen Sicherheitsanforderungen."
            }
          },
          {
            "@type": "Question",
            "name": "Was umfasst eine Brandschutz-Gesamtsanierung?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Eine Brandschutz-Gesamtsanierung umfasst alle Brandschutzmaßnahmen aus einer Hand: Sanierung von Brandschutzwänden, Einbau und Instandsetzung von Brandabschottungen, Erneuerung von Brandschutztüren sowie die begleitende Sachverständigenbegleitung zur rechtssicheren Abnahme und Dokumentation."
            }
          },
          {
            "@type": "Question",
            "name": "Wann benötige ich ein Türengutachten?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ein Türengutachten wird benötigt bei Bestandsaufnahmen vor Sanierungen, bei Behördenabnahmen, zur Dokumentation des Zustands von Brand-, Rauch- und Sicherheitstüren sowie bei Haftungsfragen. Jürgen Arnold erstellt rechtssichere Türengutachten als TÜV- und EIPOS-zertifizierter Sachverständiger."
            }
          },
